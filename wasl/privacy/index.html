        .dropdown-content { display: none; position: absolute; top: 100%; right: 0; margin-top: 10px; background: var(--md-sys-color-surface); min-width: 120px; box-shadow: var(--glass-shadow); border-radius: 16px; overflow: hidden; z-index: 1; border: 1px solid var(--card-border); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); }
        .dropdown:hover .dropdown-content { display: block; }
        html[dir="ltr"] .dropdown-content { right: 0; left: auto; }
        .dropdown-content button { color: var(--md-sys-color-on-surface); padding: 12px 15px; text-decoration: none; display: block; width: 100%; text-align: left; background: none; border: none; font-family: inherit; font-size: 1rem; cursor: pointer; transition: 0.3s; font-weight: bold; }
        html[dir="rtl"] .dropdown-content button { text-align: right; }
        .dropdown-content button:hover { background: var(--md-sys-color-primary); color: #fff; }

        .legal-container { max-width: 800px; margin: 40px auto; padding: 40px; background: var(--md-sys-color-surface); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--card-border); border-radius: 24px; box-shadow: var(--glass-shadow); flex: 1; transition: 0.4s;}

        .last-updated { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 40px; border-bottom: 1px solid var(--card-border); padding-bottom: 20px; font-weight: 500; }

        .legal-content p { color: var(--text-muted); margin-bottom: 15px; font-size: 1.05rem; }
        .legal-content ul { color: var(--text-muted); margin-bottom: 15px; padding-inline-start: 25px; font-size: 1.05rem; }
        .legal-content li { margin-bottom: 12px; }

        @media (max-width: 768px) {
            .legal-container { margin: 20px; padding: 25px; }
            .page-title { font-size: 1.8rem; }
        }

                back_to_wasl: "Back to Wasl App", page_title: "Privacy Policy", last_updated: "Last Updated: September 2026",
                intro_text: "Developer Ahmad Aldarwish is committed to protecting your privacy. This Privacy Policy explains how information is handled when you use the Wasl app across all supported platforms (Android Smartphones, Wear OS watches, Android TV, and Automotive).",
                h_data: "1. Data Collection and Privacy-First Principle", 
                p_data_1: "Wasl is built on a strict Privacy-First principle. The developer does not sell, rent, or trade your personal data with third parties or advertising networks. Data remains stored locally on your device by default, with clear user options for account creation, cloud backup, and multi-device synchronization:",
                li_data_1: "<strong>Location Data (Optional):</strong> Location access (Approximate/Precise) is requested solely to calculate accurate prayer times, determine Qibla direction, and display nearby mosques and Islamic places. This is strictly optional: Users can choose to grant GPS access or manually select their city/region to avoid GPS usage entirely. Location processing occurs locally or via secure Cloud Functions and is never sold or linked to advertising profiles.",
                li_data_2: "<strong>User Accounts & Profile Data (Optional):</strong> You may optionally create a Wasl account using Email/Password or Google Sign-In (via Google Credential Manager). When you create an account, basic profile metadata (email address, display name, and optional profile avatar picture) is collected. Profile pictures uploaded by users are stored securely in Firebase Storage (users/{userId}/profile_avatar.jpg).",
                li_data_3: "<strong>Cloud Backup & Realtime Sync (Optional):</strong> If logged in, Wasl backs up your app settings, tracker records (prayer logs, Quran reading progress, adhkar progress), and custom adhkar to a secure Firebase Firestore database (users/{userId}/backups/app_data). This enables Realtime Synchronization across your connected devices. You can enable or disable Auto Cloud Backup and Realtime Sync at any time in the app settings.",
                li_data_4: "<strong>Android System Backup (Optional):</strong> If enabled, the app also utilizes the standard Android Backup Service (Google Drive) to securely back up local settings and databases to your personal Google Drive account.",
                li_data_5: "<strong>Anonymous Activity Heartbeat (Optional):</strong> To monitor app service availability and active usage volume, the app sends a randomly generated unique identifier (UUID) and a \"last seen\" timestamp to a secure Firestore database when opened. This identifier is generated locally, stored in private app storage, and is never linked to your identity, phone number, or hardware IDs (such as IMEI). You can disable this feature at any time via the \"Anonymous Analytics\" toggle in Settings > About.",
                li_data_6: "<strong>Custom Adhkar & Local Tracker Records:</strong> All custom adhkar, tasbeeh counters, and worship logs are saved in your phone’s local database (AppDatabase). If signed in, custom adhkar are backed up to your private cloud storage document.",
                li_data_7: "<strong>Mosque & Place Suggestions:</strong> Submissions made via the \"Suggest a Mosque / Place\" feature (name, category, coordinates, phone) are transmitted securely via Firebase Cloud Functions solely to review and add to the public community database.",
                li_data_8: "<strong>Zakat Calculator Inputs:</strong> Financial values entered into the Zakat Calculator are stored strictly on your device. Your financial inputs are not collected, monitored, or transmitted.",
                li_data_9: "<strong>Downloaded Media Caching:</strong> Downloaded reciter audio files and Quran font packages are cached locally in private app storage for offline playback.",
                
                h_deletion: "2. Account Deletion & Right to Erase",
                p_deletion_1: "You have full ownership and control over your account and data:",
                li_deletion_1: "You can request full account deletion at any time directly within the app (Settings > Account > Delete Account).",
                li_deletion_2: "Account deletion immediately and permanently deletes your profile avatar from Firebase Storage, erases all cloud backups and settings from Firebase Firestore, and deletes your Firebase Authentication account.",
                
                h_permissions: "3. Sensitive Permissions & Usage",
                li_permissions_1: "<strong>Location (ACCESS_FINE_LOCATION, ACCESS_COARSE_LOCATION):</strong> Used for local prayer times, Qibla compass, and nearby mosques (replaceable by manual city selection).",
                li_permissions_2: "<strong>Notifications (POST_NOTIFICATIONS, POST_PROMOTED_NOTIFICATIONS):</strong> Delivers Adhan audio alerts, Iqamah alerts, prayer countdowns, and optional community broadcast announcements.",
                li_permissions_3: "<strong>Exact Alarms (SCHEDULE_EXACT_ALARM, USE_EXACT_ALARM):</strong> Required to trigger precise Adhan audio playback and reminders at exact prayer times across battery-saving modes.",
                li_permissions_4: "<strong>Usage Access & System Overlay (PACKAGE_USAGE_STATS, SYSTEM_ALERT_WINDOW):</strong> Used exclusively for the optional Focus Mode / App Blocker feature to block selected distracting applications during prayer times.",
                li_permissions_5: "<strong>Local Network & Nearby Devices (ACCESS_LOCAL_NETWORK, NEARBY_WIFI_DEVICES):</strong> Used to discover smart TVs/speakers and cast Adhan audio/video over your local Wi-Fi network.",
                li_permissions_6: "<strong>Foreground Services (FOREGROUND_SERVICE):</strong> Used for continuous audio playback of Quran recitations, persistent live prayer countdown notifications, and local cast streaming.",
                
                h_noads: "4. Absolute No-Ads & No-Tracking Policy", 
                p_noads_1: "Wasl contains zero advertisements and does not conduct behavioral tracking. The Google Advertising ID permission (com.google.android.gms.permission.AD_ID) is explicitly removed from the app manifest to guarantee that your device cannot be tracked for advertising purposes. Local crash reporting cleans up logs older than 24 hours automatically.",
                
                h_cast: "5. Smart Cast & Local Web Server Privacy", 
                p_cast_1: "To stream Adhan audio/video to local smart TVs or DLNA/Chromecast speakers, Wasl runs a lightweight, temporary local HTTP web server (LocalWebServer) strictly on your device during the cast session. All media streaming occurs directly within your local home network. The developer does not collect or monitor your home network topology, Wi-Fi credentials, or connected local device details.",
                
                h_payments: "6. Financial Privacy", 
                p_payments_1: "In-app contributions to support project development are processed entirely through the Google Play Billing API. The developer does not collect, process, or store your credit card details or financial payment credentials.",

            ar: {
                back_to_wasl: "العودة لتطبيق وصل", page_title: "سياسة الخصوصية", last_updated: "آخر تحديث: سبتمبر 2026",
                intro_text: "يلتزم المطور أحمد الدرويش بحماية خصوصيتك. توضح سياسة الخصوصية هذه كيفية التعامل مع المعلومات عند استخدامك لتطبيق وصل على جميع المنصات المدعومة (هواتف أندرويد، ساعات Wear OS، أجهزة Android TV، وشاشات السيارات Automotive).",

                li_data_2: "<strong>حسابات المستخدمين وبيانات الملف الشخصي (اختياري):</strong> يمكنك اختيارياً إنشاء حساب وصل باستخدام البريد الإلكتروني/كلمة المرور أو تسجيل الدخول عبر Google. عند إنشاء حساب، يتم جمع البيانات الوصفية الأساسية للملف الشخصي (عنوان البريد الإلكتروني، الاسم، وصورة اختيارية للملف الشخصي). يتم تخزين صور الملف الشخصي التي يرفعها المستخدمون بأمان في مساحة تخزين Firebase (Firebase Storage).",
                li_data_3: "<strong>النسخ الاحتياطي السحابي والمزامنة اللحظية (اختياري):</strong> إذا قمت بتسجيل الدخول، يقوم التطبيق بنسخ إعداداتك وسجلات التتبع (سجلات الصلاة، تقدم قراءة القرآن، تقدم الأذكار) والأذكار المخصصة إلى قاعدة بيانات Firebase Firestore السحابية الآمنة. يتيح ذلك المزامنة اللحظية عبر أجهزتك المتصلة. يمكنك تفعيل أو تعطيل النسخ الاحتياطي التلقائي والمزامنة اللحظية في أي وقت من إعدادات التطبيق.",
                li_data_4: "<strong>النسخ الاحتياطي لنظام أندرويد (اختياري):</strong> إذا تم تفعيله، يستخدم التطبيق أيضاً خدمة النسخ الاحتياطي القياسية في أندرويد (Google Drive) لنسخ الإعدادات وقواعد البيانات المحلية بشكل آمن إلى حساب Google Drive الخاص بك.",
                li_data_5: "<strong>نبض النشاط المجهول (اختياري):</strong> لمراقبة توفر الخدمة وحجم الاستخدام النشط، يرسل التطبيق معرّفاً فريداً تم إنشاؤه عشوائياً (UUID) وطابعاً زمنياً لـ \"آخر ظهور\" إلى قاعدة بيانات Firestore الآمنة عند فتح التطبيق. يتم إنشاء هذا المعرف محلياً وتخزينه في مساحة تخزين خاصة، ولا يتم ربطه بهويتك أو رقم هاتفك أو معرفات الأجهزة (مثل IMEI). يمكنك تعطيل هذه الميزة في أي وقت عبر مفتاح \"التحليلات المجهولة\" في الإعدادات > حول.",

                h_data: "1. Datenerhebung und Privacy-First-Prinzip",

                li_data_4: "<strong>Android-System-Backup (Optional):</strong> Wenn aktiviert, nutzt die App auch den Standard-Android-Backup-Dienst (Google Drive), um lokale Einstellungen und Datenbanken sicher auf Ihrem persönlichen Google Drive-Konto zu sichern.",
                li_data_5: "<strong>Anonymer Aktivitäts-Heartbeat (Optional):</strong> Um die Verfügbarkeit der App zu überwachen, sendet die App beim Öffnen eine zufällig generierte eindeutige Kennung (UUID) und einen \"Zuletzt gesehen\"-Zeitstempel an eine sichere Firestore-Datenbank. Diese Kennung ist nicht mit Ihrer Identität verknüpft. Sie können diese Funktion jederzeit über den Schalter \"Anonyme Analysen\" deaktivieren.",
                li_data_6: "<strong>Benutzerdefinierte Adhkar & lokale Tracker-Logs:</strong> Alle benutzerdefinierten Adhkar und Logs werden in der lokalen Datenbank (AppDatabase) Ihres Telefons gespeichert.",

        function setLanguage(lang) {
            localStorage.setItem('preferredLang', lang);
            document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.documentElement.setAttribute('lang', lang);
            document.getElementById('current-lang-text').textContent = lang.toUpperCase();
            
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang][key]) { element.innerHTML = translations[lang][key]; }
            });
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('theme-icon').textContent = newTheme === 'dark' ? 'light_mode' : 'dark_mode';
            localStorage.setItem('preferredTheme', newTheme);
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('preferredTheme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('theme-icon').textContent = savedTheme === 'dark' ? 'light_mode' : 'dark_mode';

            const savedLang = localStorage.getItem('preferredLang') || 'en';
            setLanguage(savedLang);
        };
    </script>
